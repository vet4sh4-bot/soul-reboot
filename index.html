<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Reboot</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
}

/* Лого */
#logo {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    animation: fadeOut 2s forwards;
    animation-delay: 2s;
}

#logo img {
    width: 60%;
    max-width: 400px;
}

/* Видео фон */
#menu {
    display: none;
}

#bgVideo {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}
</style>
</head>
<body>

<!-- Лого -->
<div id="logo">
    <img src="assets/images/logo.png">
</div>

<!-- Меню -->
<div id="menu">
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="assets/bq.mp4" type="video/mp4">
    </video>
</div>

<script>
setTimeout(() => {
    document.getElementById("menu").style.display = "block";
}, 2000);
</script>

</body>
</html>
