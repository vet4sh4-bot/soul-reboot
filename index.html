<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Reboot</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Лого экран */
#logo {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    animation: fadeOut 2s forwards;
    animation-delay: 2s;
}

#logo img {
    width: 60%;
    max-width: 400px;
}

/* Главное меню */
#menu {
    display: none;
}

/* Видео фон */
#bgVideo {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
}

/* Затемнение поверх видео */
#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
}

/* Кнопка */
#playButton {
    position: fixed;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 40px;
    font-size: 20px;
    background: transparent;
    border: 2px solid white;
    color: white;
    cursor: pointer;
    letter-spacing: 2px;
}

#playButton:hover {
    background: white;
    color: black;
}

/* Анимация исчезновения лого */
@keyframes fadeOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}
</style>
</head>
<body>

<!-- ЛОГО -->
<div id="logo">
    <img src="assets/logo.png" alt="Logo">
</div>

<!-- МЕНЮ -->
<div id="menu">

    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="assets/bq.mp4" type="video/mp4">
    </video>

    <div id="overlay"></div>

    <button id="playButton">ИГРАТЬ</button>

</div>

<script>
setTimeout(() => {
    document.getElementById("menu").style.display = "block";
}, 2000);
</script>

</body>
</html>
